spring.application.name=investment-service
server.port=8085

# Enable on one Investment instance only after stopping the monolith's market scheduler.
investment.market-simulation.enabled=${INVESTMENT_MARKET_SIMULATION_ENABLED:false}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=investment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

jwt-secret=${JWT_SECRET}

#Authentication REST Client
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8084}
internal.service.key=${INTERNAL_SERVICE_KEY}
auth.service.connect-timeout=1000
auth.service.read-timeout=2000
