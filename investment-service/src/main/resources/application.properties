spring.application.name=investment-service
server.port=8085

# Enable on one Investment instance only after stopping the monolith's market scheduler.
investment.market-simulation.enabled=${INVESTMENT_MARKET_SIMULATION_ENABLED:false}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=investment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

jwt-secret=${JWT_SECRET}

#Authentication REST Client
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8084}
internal.service.key=${INTERNAL_SERVICE_KEY}
auth.service.connect-timeout=1000
auth.service.read-timeout=2000

# legacy sandbox client
myfatoorah.enabled=${MYFATOORAH_ENABLED:false}
myfatoorah.api.token=${MYFATOORAH_API_TOKEN}
myfatoorah.api.connect-timeout=${MYFATOORAH_CONNECT_TIMEOUT:3000}
myfatoorah.api.read-timeout=${MYFATOORAH_READ_TIMEOUT:10000}

# wallet limits and retry window
wallet.deposit.max-amount=${WALLET_DEPOSIT_MAX_AMOUNT:10000.00}
wallet.withdrawal.max-amount=${WALLET_WITHDRAWAL_MAX_AMOUNT:10000.00}
wallet.deposit.stripe-retry-window-hours=${STRIPE_RETRY_WINDOW_HOURS:23}
# old provider settings
wallet.deposit.payment-method-id=${MYFATOORAH_PAYMENT_METHOD_ID:2}
wallet.deposit.callback-url=${MYFATOORAH_CALLBACK_URL:}
wallet.deposit.error-url=${MYFATOORAH_ERROR_URL:}

# stripe sandbox settings
stripe.enabled=${STRIPE_ENABLED:true}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.api-version=${STRIPE_API_VERSION:2026-10-28.endive}
stripe.connect-timeout=${STRIPE_CONNECT_TIMEOUT:3000}
stripe.read-timeout=${STRIPE_READ_TIMEOUT:10000}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/wallet?payment=success&session_id={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/wallet?payment=cancelled}
