root /usr/share/nginx/html;
index index.html;
access_log /var/log/nginx/access.log portfolio;
server_tokens off;
client_max_body_size 6m;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;

# Docker DNS is resolved at request time, including after a backend is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;
set $auth_backend auth-service:8084;
set $investment_backend investment-service:8085;
set $notification_backend notification-service:8083;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_cache off;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "frontend ready\n";
}

# The service-to-service endpoint must not be reachable through the public gateway.
location ~ ^/api/auth/internal(?:/|$) { return 404; }

location /api/auth/ {
    rewrite ^/api/auth(/.*)$ $1 break;
    proxy_pass http://$auth_backend;
}
location /api/investment/ {
    rewrite ^/api/investment(/.*)$ $1 break;
    proxy_pass http://$investment_backend;
}
location /api/notification/ {
    rewrite ^/api/notification(/.*)$ $1 break;
    proxy_pass http://$notification_backend;
    # Existing fetch-based JWT SSE: do not buffer or compress events.
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 1900s;
}
location /api/ { return 404; }

location / {
    # Includes /wallet Stripe return path and existing state-based navigation.
    try_files $uri $uri/ /index.html;
}
