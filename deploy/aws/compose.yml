name: investment-aws

x-java-common: &java-common
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/investment_portfolio
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/aws/.env}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: ${JWT_SECRET:?Set a shared Base64 JWT_SECRET}
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres_db:
    <<: *service
    image: postgres:18.6
    mem_limit: 256m
    environment:
      POSTGRES_DB: investment_portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      # Official PostgreSQL entrypoint runs these only for a NEW, empty database.
      - ../../investment_schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../../assets_data.sql:/docker-entrypoint-initdb.d/20-assets.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d investment_portfolio"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka:
    <<: *service
    image: apache/kafka:4.1.0
    mem_limit: 768m
    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx128m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  auth-service:
    <<: *service
    image: shaikhahsn/investment-auth:${IMAGE_TAG:-latest}
    mem_limit: 640m
    environment:
      <<: *java-common
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set a shared INTERNAL_SERVICE_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_UPLOADS_DIRECTORY: /app/uploads
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    volumes:
      - profile-uploads:/app/uploads
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084; printf 'GET /auth/me HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r line <&3; [[ $$line == *' 401 '* || $$line == *' 403 '* ]]"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 90s

  investment-service:
    <<: *service
    image: shaikhahsn/investment-service:${IMAGE_TAG:-latest}
    mem_limit: 896m
    environment:
      <<: *java-common
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set a shared INTERNAL_SERVICE_KEY}
      AUTH_SERVICE_URL: http://auth-service:8084
      INVESTMENT_MARKET_SIMULATION_ENABLED: "true"
      STRIPE_ENABLED: "true"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set a Stripe SANDBOX secret key}
      STRIPE_SUCCESS_URL: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/wallet?payment=success&session_id={CHECKOUT_SESSION_ID}"
      STRIPE_CANCEL_URL: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/wallet?payment=cancelled"
      MYFATOORAH_ENABLED: "false"
      MYFATOORAH_API_TOKEN: ""
      AI_HELP_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      AI_HELP_CACHE_DIRECTORY: /app/help-cache
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx448m"
    volumes:
      - help-cache:/app/help-cache
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085; printf 'GET /assets HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r line <&3; [[ $$line == *' 401 '* ]]"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 120s

  notification-service:
    <<: *service
    image: shaikhahsn/investment-notification:${IMAGE_TAG:-latest}
    mem_limit: 512m
    environment:
      <<: *java-common
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD}
      EMAIL_VERIFICATION_URL: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/api/auth/auth/verify"
      EMAIL_PASSWORD_RESET_URL: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m"
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083; printf 'GET /notifications/subscribe HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r line <&3; [[ $$line == *' 401 '* ]]"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    <<: *service
    image: investment-frontend:aws
    build:
      context: ../..
      dockerfile: deploy/aws/frontend.Dockerfile
    mem_limit: 128m
    ports:
      - "80:80"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST to a DNS name or public IP}
      NGINX_ENVSUBST_FILTER: "^PUBLIC_HOST$$"
    volumes:
      - ./nginx/http.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/routes.conf:/etc/nginx/snippets/routes.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      investment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  kafka-data:
  profile-uploads:
  help-cache:
